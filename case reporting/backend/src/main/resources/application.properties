server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${COOKIE_SAME_SITE:none}
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jackson.default-property-inclusion=non_null
spring.web.resources.add-mappings=false
app.encryption-key=${APP_ENCRYPTION_KEY}
app.cors-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
app.report-retention-days=${REPORT_RETENTION_DAYS:365}
app.audit-retention-days=${AUDIT_RETENTION_DAYS:730}
logging.level.org.springframework.web=ERROR
logging.level.org.springframework.security=ERROR
